name: checks

on:
  push:
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
      - name: Compile Python and check Bash syntax
        run: |
          python -m compileall -q attacks src scripts tests
          for script in sh/*.sh; do bash -n "$script"; done
      - name: Check CLI entry points
        run: |
          for script in scripts/*.py; do python "$script" --help > /dev/null; done
      - name: Run regression tests
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q
